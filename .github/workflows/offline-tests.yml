name: Offline tests

on:
  push:
    branches:
      - feat/1-evolve-typed-delivery-engine-core
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install -e . pytest pyyaml
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test offline policy, session, and hooks
        run: python -m pytest -q
      - name: Git whitespace validation
        run: git diff --check HEAD^ HEAD
